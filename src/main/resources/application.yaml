spring:
  application:
    name: springdrasil

  datasource:
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: validate

  flyway:
    enabled: true

server:
  forward-headers-strategy: framework

springdrasil:
  authlib:
    prefix: ${AUTHLIB_PREFIX:authlib}
    session-token-timeout: ${SESSION_TIMEOUT:10d}
    max-tokens-per-user-in-rotation: ${MAX_TOKENS_PER_USER:5}
    max-profiles-per-request: ${MAX_PROFILES_PER_REQUEST:10}
    base-domain-url: ${BASE_DOMAIN_URL}
    yggdrasil-signature-private-key: ${YGGDRASIL_SIGNATURE_PRIVATE_KEY}
    yggdrasil-signature-public-key: ${YGGDRASIL_SIGNATURE_PUBLIC_KEY}

  admin:
    profile-name: ${ADMIN_NAME}
    email: ${ADMIN_EMAIL}
    password: ${ADMIN_PASSWORD}

  jwt:
    secret-key: ${JWT_SECRET_KEY:}
    token-duration: ${JWT_TOKEN_DURATION:15m}
    refresh-token-duration: ${REFRESH_TOKEN_DURATION:30d}

  web:
    frontend-enabled: ${FRONTEND_ENABLED:true}
    https-enabled: ${HTTPS_ENABLED:true}
