spring:
  application:
    name: springdrasil

  datasource:
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: validate

  flyway:
    enabled: true

server:
  forward-headers-strategy: framework

springdrasil:
  application:
    session-token-timeout: ${SESSION_TIMEOUT:10d}
    max-tokens-per-user-in-rotation: ${MAX_TOKENS_PER_USER:5}
    texture-base-url: ${TEXTURE_BASE_URL}
    yggdrasil-signature-private-key: ${YGGDRASIL_SIGNATURE_PRIVATE_KEY}
    yggdrasil-signature-public-key: ${YGGDRASIL_SIGNATURE_PUBLIC_KEY}
    web-enabled: ${WEB_ENABLED:true}
    authlib-prefix: ${AUTHLIB_PREFIX:/authlib}
